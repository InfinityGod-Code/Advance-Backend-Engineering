spring.application.name=notification-service
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest

app.kafka.topics.order-events=order-events
app.kafka.topics.shipment-events=shipment-events
app.kafka.topics.delivery-events=delivery-events

# Postgres Database
spring.datasource.url=jdbc:postgresql://localhost:5435/notificationdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=notification
spring.datasource.password=notification

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
