spring.application.name=delivery-service
spring.kafka.bootstrap-servers=kafka:9092

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.json.trusted.packages=com.tracker.common_events
spring.kafka.properties.json.type.mappings=com.tracker.common_events.ShipmentStartedEvent:com.tracker.common_events.ShipmentStartedEvent
app.kafka.topics.shipment-events=shipment-events
app.kafka.topics.delivery-events=delivery-events

# Postgres Database
spring.datasource.url=jdbc:postgresql://localhost:5434/deliverydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=delivery
spring.datasource.password=delivery

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
