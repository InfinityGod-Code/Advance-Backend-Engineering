spring.application.name=shipment-service
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shipment-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# H2 Database
spring.datasource.url=jdbc:h2:mem:shipmentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka topics
app.kafka.topics.order-events=order-events
app.kafka.topics.shipment-events=shipment-events
